<header class="publication-header">
  <div class="publication-header-inner">
    <button type="button" class="header-menu-button" aria-label="Open mobile menu" [attr.aria-expanded]="mobileMenuOpen" aria-controls="public-mobile-navigation" (click)="toggleMobileMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
    <nav class="header-desktop-nav" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="is-current" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page">Home</a>
      <a routerLink="/top-stories" routerLinkActive="is-current" ariaCurrentWhenActive="page">Top Stories</a>
      <a routerLink="/special-issues" routerLinkActive="is-current" ariaCurrentWhenActive="page">Special Issues</a>
    </nav>
    <a routerLink="/" class="header-brand" aria-label="Paragon home">
      <img [src]="globalSettings()?.general?.logoUrl || 'assets/PRG_Logo.png'" [alt]="(globalSettings()?.general?.siteName || 'Paragon') + ' logo'" />
    </a>
    <div class="header-actions">
      <div class="header-weather"><span>{{ temperature() ?? '--' }}°C</span><span>{{ city() ?? 'Detecting…' }}</span></div>
      <div class="header-clock"><time>{{ now() | date:'EEE, MMM d, y' }}</time><span>{{ now() | date:'h:mm:ss a' }}</span></div>
      <button type="button" class="header-search-button" aria-label="Search" (click)="openSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 5 5" /></svg>
      </button>
    </div>
  </div>
  <nav *ngIf="mobileMenuOpen" id="public-mobile-navigation" class="header-mobile-nav" aria-label="Mobile navigation">
    <a routerLink="/" (click)="closeMobileMenu()" routerLinkActive="is-current" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page">Home</a>
    <a routerLink="/top-stories" (click)="closeMobileMenu()" routerLinkActive="is-current" ariaCurrentWhenActive="page">Top Stories</a>
    <a routerLink="/special-issues" (click)="closeMobileMenu()" routerLinkActive="is-current" ariaCurrentWhenActive="page">Special Issues</a>
  </nav>
</header>
<app-search-modal *ngIf="searchOpen" (close)="closeSearch()"></app-search-modal>
