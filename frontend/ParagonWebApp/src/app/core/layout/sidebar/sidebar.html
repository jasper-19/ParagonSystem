<aside class="admin-sidebar" [class.is-expanded]="isSidebarOpen" aria-label="Administration navigation">
  <nav #sidebarNavigation id="admin-sidebar-navigation" class="sidebar-navigation"
    aria-label="Primary administration navigation" (keydown)="onSidebarKeydown($event)">
    <div class="sidebar-brand">
      <div class="brand-identity">
        <img src="assets/PRG_Logo.png" alt="Paragon" class="brand-logo" />
        <span class="sidebar-label brand-name">Paragon Admin</span>
      </div>
      <button *ngIf="isSidebarOpen" type="button" (click)="toggleSidebar()"
        class="sidebar-toggle" aria-label="Collapse sidebar">
        <svg aria-hidden="true" fill="currentColor" viewBox="0 0 24 24">
          <path d="M13 21h6c1.1046 0 2-.8954 2-2V5c0-1.10457-.8954-2-2-2h-6v18Z"/>
          <path fill-rule="evenodd" d="M11 3H5c-1.10457 0-2 .89543-2 2v14c0 1.1046.89543 2 2 2h6V3Zm-2.29295 7.7071c.39052-.3905.39052-1.02368 0-1.41421-.39053-.39052-1.02369-.39052-1.41421 0L5.29289 11.2928c-.39052.3906-.39052 1.0237 0 1.4142l1.99995 2c.39052.3905 1.02368.3905 1.41421 0 .39052-.3905.39052-1.0237 0-1.4142l-1.29284-1.2929 1.29284-1.2928Z" clip-rule="evenodd"/>
        </svg>
      </button>
      <button *ngIf="!isSidebarOpen" type="button" (click)="toggleSidebar()"
        class="sidebar-toggle" aria-label="Expand sidebar">
        <svg aria-hidden="true" fill="currentColor" viewBox="0 0 24 24">
          <path d="M13 21h6c1.1046 0 2-.8954 2-2V5c0-1.10457-.8954-2-2-2h-6v18Z"/>
          <path fill-rule="evenodd" d="M11 3H5c-1.10457 0-2 .89543-2 2v14c0 1.1046.89543 2 2 2h6V3Zm-5.70711 7.7071c-.39052-.3905-.39052-1.02368 0-1.41421.39053-.39052 1.02369-.39052 1.41422 0l1.99994 1.99991c.39052.3906.39052 1.0237 0 1.4142l-1.99994 2c-.39053.3905-1.02369.3905-1.41422 0-.39052-.3905-.39052-1.0237 0-1.4142l1.29284-1.2929-1.29284-1.2928Z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>
    <div class="sidebar-main">
      <ng-container *ngFor="let item of navItems">
        <a *ngIf="!item.children && item.route" [routerLink]="item.route"
          routerLinkActive #rla="routerLinkActive" [routerLinkActiveOptions]="{ exact: item.route === '/admin' }"
          class="sidebar-control" [class.is-active]="rla.isActive"
          [attr.aria-current]="rla.isActive ? 'page' : null" [attr.aria-label]="!isSidebarOpen ? item.label : null"
          [appSidebarTooltip]="item.label" [tooltipEnabled]="!isSidebarOpen" tooltipPlacement="right">
          <span class="sidebar-icon" aria-hidden="true" [innerHTML]="getIcon(item.icon)"></span>
          <span class="sidebar-label">{{ item.label }}</span>
        </a>
        <div *ngIf="item.children" routerLinkActive #parentRla="routerLinkActive" class="sidebar-group">
          <button #parentButton type="button" (click)="$event.stopPropagation(); toggleItem(item)"
            class="sidebar-control" [class.is-active]="parentRla.isActive" [class.is-open]="item.open"
            [attr.data-sidebar-parent]="getSubmenuId(item)" [attr.aria-expanded]="item.open"
            [attr.aria-controls]="getSubmenuId(item)"
            [attr.aria-label]="!isSidebarOpen ? (item.open ? 'Collapse ' : 'Expand ') + item.label : null"
            [appSidebarTooltip]="item.label" [tooltipEnabled]="!isSidebarOpen" tooltipPlacement="right">
            <span class="sidebar-icon" aria-hidden="true" [innerHTML]="getIcon(item.icon)"></span>
            <span class="sidebar-label">{{ item.label }}</span>
            <svg aria-hidden="true" class="sidebar-chevron" [class.is-rotated]="item.open"
              fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          <div *ngIf="item.open" [id]="getSubmenuId(item)" [attr.data-sidebar-submenu]="getSubmenuId(item)"
            role="group" [attr.aria-label]="item.label" class="sidebar-submenu">
            <a *ngFor="let child of item.children" [routerLink]="child.route"
              routerLinkActive #childRla="routerLinkActive" class="sidebar-control sidebar-child"
              [class.is-active]="childRla.isActive" [attr.aria-current]="childRla.isActive ? 'page' : null"
              [attr.aria-label]="!isSidebarOpen ? child.label : null"
              [appSidebarTooltip]="child.label" [tooltipEnabled]="!isSidebarOpen" tooltipPlacement="right">
              <span class="sidebar-icon" aria-hidden="true" [innerHTML]="getIcon(child.icon)"></span>
              <span class="sidebar-label">{{ child.label }}</span>
            </a>
          </div>
        </div>
      </ng-container>
    </div>
    <div class="sidebar-account">
      @for (accountItem of accountItems; track accountItem.label) {
        @if (accountItem.action === 'logout') {
          <button type="button" (click)="requestLogout()" class="sidebar-control sidebar-logout"
            [attr.aria-label]="!isSidebarOpen ? accountItem.label : null"
            [appSidebarTooltip]="accountItem.label" [tooltipEnabled]="!isSidebarOpen" tooltipPlacement="right">
            <span class="sidebar-icon" aria-hidden="true" [innerHTML]="getIcon(accountItem.icon)"></span>
            <span class="sidebar-label">{{ accountItem.label }}</span>
          </button>
        } @else if (accountItem.route) {
          <a [routerLink]="accountItem.route" routerLinkActive #accountRla="routerLinkActive"
            class="sidebar-control" [class.is-active]="accountRla.isActive"
            [attr.aria-current]="accountRla.isActive ? 'page' : null"
            [attr.aria-label]="!isSidebarOpen ? accountItem.label : null"
            [appSidebarTooltip]="accountItem.label" [tooltipEnabled]="!isSidebarOpen" tooltipPlacement="right">
            <span class="sidebar-icon" aria-hidden="true" [innerHTML]="getIcon(accountItem.icon)"></span>
            <span class="sidebar-label">{{ accountItem.label }}</span>
          </a>
        }
      }
    </div>
  </nav>
</aside>
