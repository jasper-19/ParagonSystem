  <!-- HERO (reused from home) -->
 <app-welcome-banner></app-welcome-banner>

<ng-container *ngIf="article$ | async as article; else loading">


  <!-- META -->
  <app-article-meta
  [title]="article.title"
  [excerpt]="article.excerpt"
  [author]="article.author"
  [publishedAt]="article.publishedAt || undefined"
  [category]="article.category"
  [views]="article.views"
  [photoby]="article.photoby"
  [graphicby]="article.graphicby"
  [illusrationby]="article.illusrationby"
  [readingTime]="'1 min read'">
</app-article-meta>

<!-- IMAGE -->
<div class="max-w-4xl mx-auto px-4 mt-8 mb-2">
  <div class="relative rounded-sm border-none p-2 sm:p-3">
    <div class="overflow-hidden">
      <img
        [src]="imageVariant(article.image, 'large')"
        [alt]="article.title"
        class="w-full h-auto object-cover" />
    </div>
  </div>
</div>

<!-- BODY -->
<section class="max-w-3xl mx-auto px-4 py-10"
         *ngIf="articleView$ | async as view">

  <app-article-section
    *ngFor="let section of view.sections"
    [section]="section">
  </app-article-section>

</section>

<!-- TAGS -->
<div *ngIf="article.tags.length"
     class="max-w-3xl mx-auto px-4 pb-16">

  <div class="flex items-center gap-2 mb-4">
    <h3 id="topics-heading"
        class=" text-[11px] font-semibold uppercase tracking-[0.16em] text-(--color-ink-muted,#62676d)">
      Tags
    </h3>
  </div>

  <ul class="flex flex-wrap gap-2" aria-labelledby="topics-heading">
    <li *ngFor="let tag of article.tags">
      <span class="inline-flex items-center px-3 py-1 text-xs uppercase tracking-[0.06em]
                   text-(--color-ink,#17181a)
                   border border-(--color-rule,#e4e2dd) rounded-sm">
        #{{ tag }}
      </span>
    </li>
  </ul>

</div>

<!-- STAFF APPLICATION -->
<app-staff-application></app-staff-application>

<ng-container *ngIf="articleFeed() as feed">

  <app-related
    [articles]="feed.related">
  </app-related>

  <app-other-stories
    [articles]="feed.otherStories">
  </app-other-stories>

</ng-container>

</ng-container>

<ng-template #loading>
  <app-article-skeleton></app-article-skeleton>
</ng-template>
