<main id="main-content" class="article-page">
  <ng-container *ngIf="article$ | async as article; else loading">
    <article>
      <app-article-meta [title]="article.title" [excerpt]="article.excerpt" [author]="article.author" [publishedAt]="article.publishedAt || undefined" [category]="article.category" [views]="article.views" [photoby]="article.photoby" [graphicby]="article.graphicby" [illusrationby]="article.illusrationby" [readingTime]="(readingTime$ | async) || undefined" />
      <figure *ngIf="article.image" class="article-cover"><img [src]="imageVariant(article.image, 'large')" [alt]="article.title" fetchpriority="high" decoding="async" /></figure>
      <div class="article-reading-layout">
        <section aria-label="Article body" *ngIf="articleView$ | async as view" class="article-body">
          <app-article-section *ngFor="let section of view.sections; let isFirst = first" [section]="section" [isFirst]="isFirst" />
        </section>
        <aside class="article-details" aria-labelledby="article-details-heading"><div class="article-details-inner">
          <h2 id="article-details-heading">Article details</h2>
          <dl><div><dt>Section</dt><dd>{{ article.category }}</dd></div><div><dt>Published</dt><dd>{{ article.publishedAt | date:'MMM d, yyyy' }}</dd></div><div><dt>Reading time</dt><dd>{{ (readingTime$ | async) || '1 min read' }}</dd></div></dl>
          <div *ngIf="article.tags.length" class="article-topics"><h2 id="topics-heading">Topics</h2><ul aria-labelledby="topics-heading"><li *ngFor="let tag of article.tags"><span>#{{ tag }}</span></li></ul></div>
        </div></aside>
      </div>
    </article>
    <app-staff-application />
    <ng-container *ngIf="articleFeed() as feed"><app-related [articles]="feed.related" /><app-other-stories [articles]="feed.otherStories" /></ng-container>
  </ng-container>
</main>
<ng-template #loading>
  <section *ngIf="articleError() as error; else articleSkeleton" class="article-error" aria-labelledby="article-error-title">
    <h1 id="article-error-title">Article unavailable</h1><p role="alert">{{ error }}</p><div><button type="button" (click)="retryArticle()">Try again</button><a routerLink="/top-stories">Browse all articles</a></div>
  </section>
</ng-template>
<ng-template #articleSkeleton><app-article-skeleton /></ng-template>
