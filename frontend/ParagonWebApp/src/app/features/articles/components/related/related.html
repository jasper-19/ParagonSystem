<section *ngIf="articles.length" class="article-recommendations related" aria-labelledby="related-stories-title"><div class="recommendations-inner"><header class="recommendations-heading"><h2 id="related-stories-title">Related articles</h2></header><div class="recommendation-list"><article *ngFor="let article of articles; trackBy: trackByArticle" class="recommendation-story"><a [routerLink]="['/article',article.slug]"><div *ngIf="article.image" class="recommendation-image"><img [src]="imageVariant(article.image,'medium')" [alt]="article.title" loading="lazy" decoding="async"/></div><div><div class="recommendation-meta"><span>{{ article.category }}</span><time [attr.datetime]="article.publishedAt | date:'yyyy-MM-dd'">{{ article.publishedAt | date:'MMM d, yyyy' }}</time></div><h3>{{ article.title }}</h3><p *ngIf="article.excerpt" class="recommendation-excerpt">{{ article.excerpt }}</p><p *ngIf="article.author" class="recommendation-author">By {{ article.author }}</p></div></a></article></div></div></section>
