<section *ngIf="articles.length" class="bg-[#fff8db] py-14 sm:py-18 lg:py-24" aria-labelledby="related-stories-title">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mb-8 border-b border-[#000035]/15 pb-5 sm:mb-10">
      <p class="mb-2 text-xs font-black uppercase tracking-[0.2em] text-[#f4b400]">Continue reading</p>
      <h2 id="related-stories-title" class="text-3xl font-black tracking-tight text-[#000035] sm:text-4xl">Related stories</h2>
    </div>

    <div class="grid gap-5 md:grid-cols-2 lg:grid-cols-3">
      <article *ngFor="let article of articles; trackBy: trackByArticle" class="min-w-0 bg-white">
        <a
          [routerLink]="['/article', article.slug]"
          class="group flex h-full flex-col focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-[#000035]"
        >
          <div class="aspect-16/10 overflow-hidden bg-[#000035]/5">
            <ng-container *ngIf="article.image; else imagePlaceholder">
              <img
                [src]="imageVariant(article.image, 'medium')"
                [alt]="article.title"
                loading="lazy"
                decoding="async"
                class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
              />
            </ng-container>
            <ng-template #imagePlaceholder>
              <app-image-placeholder size="medium" label="No image available" />
            </ng-template>
          </div>
          <div class="flex flex-1 flex-col p-5 sm:p-6">
            <div class="mb-3 flex flex-wrap items-center gap-2">
              <span class="bg-[#000035] px-2 py-1 text-[0.625rem] font-black uppercase tracking-widest text-[#F4B400]">{{ article.category }}</span>
              <time class="text-xs text-[#000035]/50">{{ article.publishedAt | date:'MMM d, yyyy' }}</time>
            </div>
            <h3 class="text-pretty text-xl font-black leading-snug text-[#000035] transition-colors group-hover:text-[#f4b400]">
              {{ article.title }}
            </h3>
            <p *ngIf="article.excerpt" class="mt-3 line-clamp-2 text-sm leading-6 text-[#000035]/65">{{ article.excerpt }}</p>
            <p *ngIf="article.author" class="mt-auto pt-5 text-xs font-semibold text-[#000035]/58">By {{ article.author }}</p>
          </div>
        </a>
      </article>
    </div>
  </div>
</section>
