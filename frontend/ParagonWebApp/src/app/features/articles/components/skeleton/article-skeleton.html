<div class="animate-pulse bg-white motion-reduce:animate-none" role="status" aria-label="Loading article">
  <span class="sr-only">Loading article…</span>

  <div class="border-b border-[#000035]/10 bg-[#fffdf7] py-10 sm:py-14">
    <div class="mx-auto max-w-5xl space-y-5 px-4 sm:px-6 lg:px-8">
      <div class="h-5 w-36 bg-[#000035]/10"></div>
      <div class="h-10 w-full max-w-4xl bg-[#000035]/10 sm:h-14"></div>
      <div class="h-10 w-4/5 max-w-3xl bg-[#000035]/10 sm:h-14"></div>
      <div class="h-5 w-full max-w-2xl bg-[#000035]/8"></div>
      <div class="h-5 w-3/4 max-w-xl bg-[#000035]/8"></div>
      <div class="mt-8 h-px bg-[#000035]/10"></div>
      <div class="h-5 w-64 bg-[#000035]/8"></div>
    </div>
  </div>

  <div class="mx-auto max-w-6xl px-4 pt-6 sm:px-6 lg:px-8">
    <div class="aspect-video bg-[#000035]/10"></div>
  </div>

  <div class="mx-auto grid max-w-6xl gap-12 px-4 py-12 sm:px-6 lg:grid-cols-[minmax(0,46rem)_1fr] lg:px-8">
    <div class="space-y-5">
      <div *ngFor="let width of lineWidths" class="h-4 bg-[#000035]/8" [style.width]="width"></div>
    </div>
    <div class="space-y-4 border-t border-[#000035]/10 pt-6 lg:border-l lg:border-t-0 lg:pl-8 lg:pt-0">
      <div class="h-4 w-28 bg-[#000035]/10"></div>
      <div class="h-px bg-[#000035]/10"></div>
      <div class="h-4 w-full bg-[#000035]/8"></div>
      <div class="h-4 w-4/5 bg-[#000035]/8"></div>
    </div>
  </div>
</div>
