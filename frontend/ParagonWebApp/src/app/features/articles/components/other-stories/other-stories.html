<section *ngIf="articles.length" class="bg-[#f7f6f2] py-14 sm:py-18 lg:py-24" aria-labelledby="other-stories-title">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mb-8 flex flex-col gap-4 border-b border-[#000035]/15 pb-5 sm:mb-10 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="mb-2 text-xs font-black uppercase tracking-[0.2em] text-[#f4b400]">From the newsroom</p>
        <h2 id="other-stories-title" class="text-3xl font-black tracking-tight text-[#000035] sm:text-4xl">More from Paragon</h2>
      </div>
      <a
        routerLink="/top-stories"
        class="inline-flex min-h-11 w-fit items-center gap-2 text-sm font-bold text-[#000035] underline-offset-4 hover:text-[#8b5e00] hover:underline focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-[#F4B400]"
      >
        View all stories <span aria-hidden="true">→</span>
      </a>
    </div>

    <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      <article *ngFor="let article of articles; trackBy: trackByArticle" class="min-w-0 border border-[#000035]/10 bg-white">
        <a
          [routerLink]="['/article', article.slug]"
          class="group flex h-full flex-col focus-visible:outline-3 focus-visible:-outline-offset-3 focus-visible:outline-[#F4B400]"
        >
          <div class="aspect-16/10 overflow-hidden bg-[#000035]/5">
            <ng-container *ngIf="article.image; else imagePlaceholder">
              <img
                [src]="imageVariant(article.image, 'thumbnail')"
                [alt]="article.title"
                loading="lazy"
                decoding="async"
                class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
              />
            </ng-container>
            <ng-template #imagePlaceholder>
              <app-image-placeholder size="small" label="No image available" />
            </ng-template>
          </div>

          <div class="flex flex-1 flex-col p-4 sm:p-5">
            <div class="mb-3 flex flex-wrap items-center gap-2">
              <span class="bg-[#F4B400] px-2 py-1 text-[0.625rem] font-black uppercase tracking-widest text-[#000035]">{{ article.category }}</span>
              <time class="text-[0.6875rem] text-[#000035]/50">{{ article.publishedAt | date:'MMM d, yyyy' }}</time>
            </div>
            <h3 class="text-pretty text-lg font-black leading-snug text-[#000035] transition-colors group-hover:text-[#f4b400]">
              {{ article.title }}
            </h3>
            <p *ngIf="article.excerpt" class="mt-2 line-clamp-2 text-sm leading-6 text-[#000035]/62">{{ article.excerpt }}</p>
            <p *ngIf="article.author" class="mt-auto border-t border-[#000035]/10 pt-4 text-xs font-semibold text-[#000035]/55">
              By {{ article.author }}
            </p>
          </div>
        </a>
      </article>
    </div>
  </div>
</section>
