<div
  *ngIf="isParagraph(section)"
  class="article-copy mb-5 text-[1.0625rem] leading-[1.78] text-[#202033] sm:text-lg sm:leading-[1.82]"
  [class.first-paragraph]="isFirst"
  [innerHTML]="section.content"
></div>

<figure *ngIf="isImage(section)" class="my-9 sm:my-12">
  <div class="overflow-hidden bg-[#000035]/5">
    <img
      [src]="section.src"
      [alt]="section.caption || 'Article image'"
      loading="lazy"
      decoding="async"
      class="mx-auto max-h-[70svh] w-full object-contain"
    />
  </div>
  <figcaption *ngIf="section.caption" class="mt-3 border-l-2 border-[#F4B400] pl-3 text-sm leading-6 text-[#000035]/60">
    {{ section.caption }}
  </figcaption>
</figure>

<blockquote *ngIf="isQuote(section)" class="my-10 border-y border-[#000035]/12 py-7 sm:my-12 sm:py-9">
  <p class="text-balance font-serif text-2xl font-bold leading-snug text-[#000035] sm:text-3xl">
    “{{ section.text }}”
  </p>
  <footer *ngIf="section.author" class="mt-4 text-sm font-bold text-[#000035]/60">— {{ section.author }}</footer>
</blockquote>

<h2 *ngIf="isHeading(section)" class="mb-4 mt-10 text-balance text-2xl font-black leading-tight text-[#000035] sm:mt-12 sm:text-3xl">
  {{ section.text }}
</h2>

<figure *ngIf="isEmbed(section) && safeEmbedUrl" class="my-10 sm:my-12">
  <div class="aspect-video overflow-hidden bg-[#000035]">
    <iframe
      [src]="safeEmbedUrl"
      title="Embedded article media"
      class="h-full w-full"
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
    ></iframe>
  </div>
</figure>
