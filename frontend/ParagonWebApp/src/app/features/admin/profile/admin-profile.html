<section
  aria-labelledby="admin-profile-title"
  class="mx-auto w-full max-w-7xl
         space-y-6 px-0
         pb-8 sm:space-y-8
         sm:pb-10"
>
  <!-- Page Header -->
  <header
    class="rounded-2xl border
           border-[#000035]/10
           bg-white px-4 py-5
           shadow-[0_1px_3px_rgba(0,0,53,0.06)]
           sm:px-6 sm:py-6
           lg:px-8"
  >
    <div
      class="flex flex-col gap-4
             sm:flex-row
             sm:items-center
             sm:justify-between"
    >
      <div class="min-w-0">
        <p
          class="text-xs font-bold
                 uppercase tracking-[0.18em]
                 text-[#F4B400]"
        >
          Account Settings
        </p>

        <h1
          id="admin-profile-title"
          class="mt-1 wrap-break-word
                 text-2xl font-bold
                 tracking-tight text-[#000035]
                 sm:text-3xl
                 lg:text-4xl"
        >
          Admin Profile
        </h1>

        <p
          class="mt-2 max-w-2xl
                 text-sm leading-6
                 text-slate-600
                 sm:text-base"
        >
          Review your staff information, strengthen
          account security, and manage signed-in devices.
        </p>
      </div>

      <div
        class="inline-flex w-fit
               items-center gap-2
               rounded-full border
               border-green-200
               bg-green-50
               px-3 py-1.5
               text-xs font-semibold
               text-green-700"
        aria-label="Account status: Active"
      >
        <span
          class="h-2 w-2 rounded-full
                 bg-green-500"
          aria-hidden="true"
        ></span>

        Active Account
      </div>
    </div>
  </header>

  <!-- Profile Overview Card -->
  <app-profile-overview [staff]="staffMember()"></app-profile-overview>

  <!-- Personal Information -->
  <app-personal-information [staff]="staffMember()"></app-personal-information>

  <!-- Security Settings-->
  <app-security-settings></app-security-settings>

</section>
