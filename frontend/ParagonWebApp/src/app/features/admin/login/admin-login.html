<main id="main-content" class="login-page">
  <div class="login-shade" aria-hidden="true"></div>

  <section
    class="login-panel" aria-labelledby="admin-login-title"
  >
    <!-- Left: form -->
    <div class="login-form-panel">
      <header>
        <div>
          <img
            src="assets/PRG_Logo.png"
            alt="Paragon Logo"
          />
        </div>

        <div>
          <h1
            id="admin-login-title"
          >
            Welcome home
          </h1>
          <p>
            Please enter your details.
          </p>
        </div>
      </header>

      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        [attr.aria-busy]="loading()"
        novalidate
      >
        <div>
          <label for="admin-username" class="field-label">
            Username
          </label>

          <div class="login-input-wrap">
            <input
              id="admin-username"
              type="text"
              formControlName="username"
              placeholder="Username"
              autocomplete="username" aria-required="true"
              autocapitalize="none"
              spellcheck="false"
              inputmode="text"
              [attr.aria-invalid]="
                form.controls.username.touched &&
                form.controls.username.invalid
              "
              [attr.aria-describedby]="
                form.controls.username.touched &&
                form.controls.username.invalid
                  ? 'admin-username-error'
                  : null
              "
            />

            <span class="username-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </div>

          <p
            id="admin-username-error" class="login-field-error"
            *ngIf="form.controls.username.touched && form.controls.username.invalid"
            role="alert"
          >
            Username is required.
          </p>
        </div>

        <div>
          <label for="admin-password" class="field-label">
            Password
          </label>

          <div class="login-input-wrap">
            <input
              id="admin-password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              (keydown)="updateCapsLock($event)"
              (keyup)="updateCapsLock($event)"
              (blur)="clearCapsLockState()"
              placeholder="Password"
              autocomplete="current-password" aria-required="true"
              enterkeyhint="go"
              [attr.aria-invalid]="
                form.controls.password.touched &&
                form.controls.password.invalid
              "
              [attr.aria-describedby]="
                form.controls.password.touched &&
                form.controls.password.invalid
                  ? 'admin-password-error'
                  : capsLockOn()
                    ? 'admin-caps-lock-message'
                    : null
              "
            />

            <button
              type="button"
              class="password-toggle" (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              [attr.aria-pressed]="showPassword()"
            >
              <svg
                *ngIf="!showPassword()"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>

              <svg
                *ngIf="showPassword()"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                <path d="m2 2 20 20"/>
              </svg>
            </button>
          </div>

          <p
            id="admin-password-error" class="login-field-error"
            *ngIf="form.controls.password.touched && form.controls.password.invalid"
            role="alert"
          >
            Password is required.
          </p>

          <p
            *ngIf="capsLockOn() && !form.controls.password.invalid"
            id="admin-caps-lock-message" class="login-caps-message"
            aria-live="polite"
          >
            Caps Lock is on.
          </p>
        </div>

        <div class="login-options">
          <label>
            <input
              type="checkbox"
            />
            Remember for 30 days
          </label>

          <button
            type="button"
          >
            Forgot password?
          </button>
        </div>

        <div
          *ngIf="error()" class="login-server-error"
          role="alert"
          aria-live="assertive"
        >
          <svg
            fill="currentColor"
            viewBox="0 0 20 20"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd"
            />
          </svg>
          <span>{{ error() }}</span>
        </div>

        <button
          type="submit" class="login-submit"
          [disabled]="loading()"
        >
          <span class="login-spinner"
            *ngIf="loading()"
            aria-hidden="true"
          ></span>
          <span>{{ loading() ? 'Signing in…' : 'Login' }}</span>
        </button>

        <div class="login-divider"><span>Or continue with</span></div>

        <div class="login-social">
          <button
            type="button"
            aria-label="Continue with Google"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21.6 12.23c0-.7-.06-1.22-.2-1.76H12v3.33h5.52c-.11.83-.73 2.08-2.1 2.92l-.02.11 2.97 2.3.21.02c1.93-1.78 3.04-4.4 3.04-6.92z" />
              <path d="M12 22c2.76 0 5.08-.91 6.78-2.48l-3.23-2.51c-.87.61-2.04 1.03-3.55 1.03-2.7 0-4.98-1.78-5.79-4.24l-.1.01-3.07 2.38-.03.1C4.68 19.55 8.06 22 12 22z" />
              <path d="M6.21 13.8A6.83 6.83 0 0 1 5.84 12c0-.63.11-1.24.35-1.8l-.01-.12-3.11-2.42-.1.05A10 10 0 0 0 2 12c0 1.6.38 3.1 1.06 4.43l3.15-2.44z" />
              <path d="M12 5.96c1.93 0 3.23.83 3.97 1.52l2.9-2.83C17.07 3.02 14.76 2 12 2 8.06 2 4.68 4.45 3.01 7.57l3.17 2.47C7.02 7.73 9.3 5.96 12 5.96z" />
            </svg>
          </button>

          <button
            type="button"
            aria-label="Continue with Facebook"
          >
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.62.77-1.62 1.56V12h2.76l-.44 2.89h-2.32v6.99A10 10 0 0 0 22 12z" />
            </svg>
          </button>
        </div>
      </form>
    </div>

    <!-- Right: decorative panel -->
    <div class="login-photo-panel">
      <div class="login-photo">
        <img
          src="assets/image2.jpg"
          alt=""
          aria-hidden="true"
          loading="lazy"
          decoding="async"
          draggable="false"
        />
        <div class="login-photo-shade" aria-hidden="true"></div>
      </div>
    </div>
  </section>
</main>
