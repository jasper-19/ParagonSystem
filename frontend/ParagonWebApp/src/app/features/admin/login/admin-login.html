<main
  class="relative flex min-h-dvh items-center justify-center
         overflow-y-auto bg-slate-950 bg-cover bg-center
         px-3 py-4 sm:px-6 sm:py-8 lg:px-8 lg:py-10"
  style="background-image: url('assets/ebheader.png');"
>
  <div
    class="absolute inset-0 bg-linear-to-br
           from-slate-950/75 via-slate-900/65 to-blue-950/55"
    aria-hidden="true"
  ></div>

  <section
    aria-labelledby="admin-login-title"
    class="relative mx-auto flex w-full max-w-5xl items-stretch
           overflow-hidden rounded-3xl border border-white/20
           shadow-2xl sm:rounded-[2.5rem]"
  >
    <!-- Left: form -->
    <div
      class="flex w-full flex-col justify-center bg-white/85
             px-5 py-7 backdrop-blur-2xl
             sm:px-10 sm:py-10 lg:w-1/2"
    >
      <header
        class="mx-auto mb-7 flex w-full max-w-md flex-col
               items-center gap-3 sm:mb-8 sm:gap-4"
      >
        <div class="flex h-14 w-14 shrink-0 items-center justify-center sm:h-16 sm:w-16">
          <img
            src="assets/PRG_Logo.png"
            alt="Paragon Logo"
            class="h-full w-full object-contain"
          />
        </div>

        <div class="text-center">
          <h1
            id="admin-login-title"
            class="text-2xl font-bold tracking-tight text-slate-950 sm:text-3xl"
          >
            Welcome home
          </h1>
          <p class="mt-1 text-sm text-[#000035]">
            Please enter your details.
          </p>
        </div>
      </header>

      <form
        [formGroup]="form"
        (ngSubmit)="submit()"
        class="mx-auto w-full max-w-md space-y-4"
        [attr.aria-busy]="loading()"
        novalidate
      >
        <div>
          <label for="admin-username" class="sr-only">
            Username
          </label>

          <div class="group relative">
            <input
              id="admin-username"
              type="text"
              formControlName="username"
              class="peer min-h-12 w-full rounded-xl border border-slate-300
                     bg-white/95 pl-4 pr-12 text-base text-slate-950 shadow-sm
                     outline-none transition duration-200
                     placeholder:text-slate-500 hover:border-slate-400
                     focus:border-blue-600 focus:bg-white focus:shadow-md
                     focus:ring-2 focus:ring-blue-600/20
                     aria-invalid:border-red-500
                     aria-invalid:ring-red-500/15 sm:text-sm"
              placeholder="Username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              inputmode="text"
              [attr.aria-invalid]="
                form.controls.username.touched &&
                form.controls.username.invalid
              "
              [attr.aria-describedby]="
                form.controls.username.touched &&
                form.controls.username.invalid
                  ? 'admin-username-error'
                  : null
              "
            />

            <span
              class="pointer-events-none absolute right-4 top-1/2
                     -translate-y-1/2 text-slate-400
                     transition-colors duration-200 peer-focus:text-blue-600"
              aria-hidden="true"
            >
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
          </div>

          <p
            id="admin-username-error"
            *ngIf="form.controls.username.touched && form.controls.username.invalid"
            class="mt-1 text-xs font-medium text-red-700"
            role="alert"
          >
            Username is required.
          </p>
        </div>

        <div>
          <label for="admin-password" class="sr-only">
            Password
          </label>

          <div class="group relative">
            <input
              id="admin-password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              (keydown)="updateCapsLock($event)"
              (keyup)="updateCapsLock($event)"
              (blur)="clearCapsLockState()"
              class="peer min-h-12 w-full rounded-xl border border-slate-300
                     bg-white/95 pl-4 pr-14 text-base text-slate-950 shadow-sm
                     outline-none transition duration-200
                     placeholder:text-slate-500 hover:border-slate-400
                     focus:border-blue-600 focus:bg-white focus:shadow-md
                     focus:ring-2 focus:ring-blue-600/20
                     aria-invalid:border-red-500
                     aria-invalid:ring-red-500/15 sm:text-sm"
              placeholder="Password"
              autocomplete="current-password"
              enterkeyhint="go"
              [attr.aria-invalid]="
                form.controls.password.touched &&
                form.controls.password.invalid
              "
              [attr.aria-describedby]="
                form.controls.password.touched &&
                form.controls.password.invalid
                  ? 'admin-password-error'
                  : capsLockOn()
                    ? 'admin-caps-lock-message'
                    : null
              "
            />

            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 inline-flex min-h-11 w-12
                     items-center justify-center rounded-r-xl text-slate-500
                     transition-colors duration-200 hover:text-slate-800
                     focus-visible:outline-none focus-visible:ring-2
                     focus-visible:ring-inset focus-visible:ring-blue-600
                     peer-focus:text-blue-600"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
              [attr.aria-pressed]="showPassword()"
            >
              <svg
                *ngIf="!showPassword()"
                viewBox="0 0 24 24"
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M2 12s3.636-7 10-7 10 7 10 7-3.636 7-10 7-10-7-10-7z" />
                <circle cx="12" cy="12" r="3" />
              </svg>

              <svg
                *ngIf="showPassword()"
                viewBox="0 0 24 24"
                class="h-5 w-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path d="M3 3l18 18" />
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                <path d="M9.88 4.24A10.94 10.94 0 0 1 12 5c6.364 0 10 7 10 7a20.29 20.29 0 0 1-4.2 5.1" />
                <path d="M6.11 6.11C3.73 7.72 2 12 2 12s3.636 7 10 7a10.83 10.83 0 0 0 4.12-.79" />
              </svg>
            </button>
          </div>

          <p
            id="admin-password-error"
            *ngIf="form.controls.password.touched && form.controls.password.invalid"
            class="mt-1 text-xs font-medium text-red-700"
            role="alert"
          >
            Password is required.
          </p>

          <p
            *ngIf="capsLockOn() && !form.controls.password.invalid"
            id="admin-caps-lock-message"
            class="mt-1 text-xs font-medium text-amber-800"
            aria-live="polite"
          >
            Caps Lock is on.
          </p>
        </div>

        <div
          class="flex flex-col gap-3 pt-1
                 min-[360px]:flex-row min-[360px]:items-center
                 min-[360px]:justify-between"
        >
          <label
            class="flex min-h-10 cursor-pointer items-center gap-2
                   text-xs text-slate-700 transition-colors
                   hover:text-slate-950"
          >
            <input
              type="checkbox"
              class="h-5 w-5 cursor-pointer rounded
                     border-slate-300 accent-blue-700"
            />
            Remember for 30 days
          </label>

          <button
            type="button"
            class="min-h-10 self-start rounded-md px-1 text-xs
                   font-semibold text-[#725400] transition-colors
                   hover:text-[#000035]
                   focus-visible:outline-none focus-visible:ring-2
                   focus-visible:ring-[#f4b400]
                   min-[360px]:self-auto"
          >
            Forgot password?
          </button>
        </div>

        <div
          *ngIf="error()"
          class="flex items-start gap-2 rounded-xl border border-red-300
                 bg-red-50 px-3 py-3 text-sm font-medium
                 leading-5 text-red-800 shadow-sm"
          role="alert"
          aria-live="assertive"
        >
          <svg
            class="mt-0.5 h-4 w-4 shrink-0"
            fill="currentColor"
            viewBox="0 0 20 20"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd"
            />
          </svg>
          <span>{{ error() }}</span>
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="inline-flex min-h-12 w-full items-center justify-center
                 rounded-xl bg-[#000035] px-4 text-sm font-bold text-white
                 shadow-lg shadow-blue-950/25 transition duration-200
                 hover:bg-[#0b1747] hover:shadow-xl
                 focus-visible:outline-none focus-visible:ring-2
                 focus-visible:ring-[#f4b400] focus-visible:ring-offset-2
                 disabled:cursor-wait disabled:opacity-65 disabled:shadow-none"
        >
          <span
            *ngIf="loading()"
            class="mr-2 h-4 w-4 animate-spin rounded-full
                   border-2 border-white/40 border-t-white
                   motion-reduce:animate-none"
            aria-hidden="true"
          ></span>
          <span>{{ loading() ? 'Signing in…' : 'Login' }}</span>
        </button>

        <div class="relative py-2">
          <div class="absolute inset-0 flex items-center" aria-hidden="true"></div>
          <div class="relative flex justify-center">
            <span class="px-3 text-xs font-medium uppercase tracking-wider text-[#000035]">
              Or continue with
            </span>
          </div>
        </div>

        <div class="flex items-center justify-center gap-3">
          <button
            type="button"
            class="group flex h-11 w-11 items-center justify-center
                   rounded-xl border border-slate-300 bg-white text-slate-700
                   shadow-sm transition duration-200
                   hover:border-slate-400 hover:bg-slate-50 hover:shadow-md
                   focus-visible:outline-none focus-visible:ring-2
                   focus-visible:ring-blue-600 focus-visible:ring-offset-2"
            aria-label="Continue with Google"
          >
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true">
              <path d="M21.6 12.23c0-.7-.06-1.22-.2-1.76H12v3.33h5.52c-.11.83-.73 2.08-2.1 2.92l-.02.11 2.97 2.3.21.02c1.93-1.78 3.04-4.4 3.04-6.92z" />
              <path d="M12 22c2.76 0 5.08-.91 6.78-2.48l-3.23-2.51c-.87.61-2.04 1.03-3.55 1.03-2.7 0-4.98-1.78-5.79-4.24l-.1.01-3.07 2.38-.03.1C4.68 19.55 8.06 22 12 22z" />
              <path d="M6.21 13.8A6.83 6.83 0 0 1 5.84 12c0-.63.11-1.24.35-1.8l-.01-.12-3.11-2.42-.1.05A10 10 0 0 0 2 12c0 1.6.38 3.1 1.06 4.43l3.15-2.44z" />
              <path d="M12 5.96c1.93 0 3.23.83 3.97 1.52l2.9-2.83C17.07 3.02 14.76 2 12 2 8.06 2 4.68 4.45 3.01 7.57l3.17 2.47C7.02 7.73 9.3 5.96 12 5.96z" />
            </svg>
          </button>

          <button
            type="button"
            class="group flex h-11 w-11 items-center justify-center
                   rounded-xl border border-slate-300 bg-white text-slate-700
                   shadow-sm transition duration-200
                   hover:border-slate-400 hover:bg-slate-50 hover:shadow-md
                   focus-visible:outline-none focus-visible:ring-2
                   focus-visible:ring-blue-600 focus-visible:ring-offset-2"
            aria-label="Continue with Facebook"
          >
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true">
              <path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.62.77-1.62 1.56V12h2.76l-.44 2.89h-2.32v6.99A10 10 0 0 0 22 12z" />
            </svg>
          </button>
        </div>
      </form>
    </div>

    <!-- Right: decorative panel -->
    <div class="relative hidden w-1/2 bg-white/95 p-4 lg:block xl:p-6">
      <div
        class="relative h-full min-h-130 w-full overflow-hidden
               rounded-[2.25rem] bg-linear-to-br
               from-blue-950 via-blue-900 to-indigo-950 shadow-inner"
      >
        <img
          src="assets/image2.jpg"
          alt=""
          aria-hidden="true"
          class="absolute inset-0 h-full w-full object-cover"
          loading="lazy"
          decoding="async"
          draggable="false"
        />
        <div
          class="absolute inset-0 bg-linear-to-br
                 from-blue-950/35 via-indigo-950/15 to-slate-950/35"
          aria-hidden="true"
        ></div>
      </div>
    </div>
  </section>
</main>
