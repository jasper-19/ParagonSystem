<div class="flex flex-wrap gap-2.5 mb-4 items-center">

  <!-- Module filter -->
  <div class="relative flex items-center">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000035" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="absolute left-2.5 pointer-events-none opacity-45">
      <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    <select
      [(ngModel)]="filters.module"
      (change)="onFilterChange()"
      class="appearance-none pl-7.5 pr-8 py-2 text-[13px] font-medium text-[#000035] bg-(--color-background-primary) border-[rgba(0,0,53,0.25)] border-[0.5px] rounded-(--border-radius-md) cursor-pointer outline-none min-w-35 transition-[border-color] duration-150 focus:border-[#f4b400] focus:ring-2 focus:ring-[rgba(244,180,0,0.15)]">
      <option value="">All modules</option>
      <option *ngFor="let module of modules" [value]="module">{{ module }}</option>
    </select>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000035" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
      class="absolute right-2.5 pointer-events-none opacity-40">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </div>

  <!-- Action filter -->
  <div class="relative flex items-center">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000035" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="absolute left-2.5 pointer-events-none opacity-45">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
    <select
      [(ngModel)]="filters.action"
      (change)="onFilterChange()"
      class="appearance-none pl-7.5 pr-8 py-2 text-[13px] font-medium text-[#000035] bg-(--color-background-primary)  border-[rgba(0,0,53,0.25)] border-[0.5px] rounded-(--border-radius-md) cursor-pointer outline-none min-w-35 transition-[border-color] duration-150 focus:border-[#f4b400] focus:ring-2 focus:ring-[rgba(244,180,0,0.15)]">
      <option value="">All actions</option>
      <option *ngFor="let action of actions" [value]="action">{{ action }}</option>
    </select>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000035" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
      class="absolute right-2.5 pointer-events-none opacity-40">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </div>

  <!-- Date picker -->
  <div class="relative flex items-center">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000035" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="absolute left-2.5 pointer-events-none opacity-45 z-10">
      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    <input
      type="date"
      [(ngModel)]="filters.dateFrom"
      (change)="onFilterChange()"
      class="pl-7.5 pr-3 py-2 text-[13px] font-medium text-[#000035] bg-(--color-background-primary)  border-[rgba(0,0,53,0.25)] border-[0.5px] rounded-(--border-radius-md) outline-none min-w-37.5 transition-[border-color] duration-150 cursor-pointer focus:border-[#f4b400] focus:ring-2 focus:ring-[rgba(244,180,0,0.15)]" />
  </div>

  <!-- Search -->
  <div class="relative flex items-center flex-1 min-w-45">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000035" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="absolute left-2.5 pointer-events-none opacity-45">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="text"
      placeholder="Search logs..."
      [(ngModel)]="filters.search"
      (input)="onFilterChange()"
      class="w-full pl-7.5 pr-3 py-2 text-[13px] text-[#000035] bg-(--color-background-primary)  border-[rgba(0,0,53,0.25)] border-[0.5px] rounded-(--border-radius-md) outline-none transition-[border-color] duration-150 focus:border-[#f4b400] focus:ring-2 focus:ring-[rgba(244,180,0,0.15)]" />
  </div>

  <!-- Reset filters button -->
  <button
    type="button"
    (click)="clearFilters()"
    class="inline-flex items-center gap-1.5 px-3.5 py-2 text-[13px] font-medium text-[rgba(0,0,53,0.5)] bg-transparent  border-[0.5px] border-[rgba(0,0,53,0.2)] rounded-(--border-radius-md) cursor-pointer whitespace-nowrap transition-all duration-150 hover:bg-[rgba(0,0,53,0.05)] hover:text-[#000035] hover:border-[rgba(0,0,53,0.35)]">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.45"/>
    </svg>
    Reset
  </button>

</div>
