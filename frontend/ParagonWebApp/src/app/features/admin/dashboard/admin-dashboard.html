<section
  aria-labelledby="dashboard-title"
  class="flex min-w-0 max-w-full flex-col
         gap-8 overflow-x-clip
         pb-[calc(6rem+env(safe-area-inset-bottom))]
         sm:gap-10
         xl:gap-12 xl:pb-0"
>
    <header class="space-y-1">
      <h1
        id="dashboard-title"
        class="text-2xl font-bold tracking-tight text-[#000035]
              sm:text-3xl"
      >
        Dashboard
      </h1>

      <p class="text-sm text-slate-600 sm:text-base">
        Review publication performance, applications, and recent activity.
      </p>
    </header>

      <div
        class="grid w-full min-w-0 max-w-full
              grid-cols-1 gap-5
              sm:gap-6
              xl:grid-cols-2 xl:gap-8"
      >
        <app-articles-summary
          [totalArticles]="facade.totalArticles()"
          [publishedArticles]="facade.publishedArticles()"
          [draftArticles]="facade.draftArticles()"
          [archivedArticles]="facade.archivedArticles()"
        />

    <app-special-issues-summary
      [totalIssues]="facade.totalSpecialIssues()"
      [publishedIssues]="facade.publishedSpecialIssues()"
      [draftIssues]="facade.draftSpecialIssues()"
      [archivedIssues]="facade.archivedSpecialIssues()"
    />
  </div>

  <app-analytics-section
    class="block w-full min-w-0 max-w-full"
    [metrics]="facade.analyticsMetrics()"
    [trendData]="facade.analyticsTrend()"
    [selectedMode]="facade.selectedMode()"
    [loading]="facade.analyticsLoading()"
    (modeChange)="facade.setMode($event)"
  />

  <app-applications-overview
    class="block w-full min-w-0 max-w-full"
    [totalApplications]="facade.totalApplications()"
    [pendingApplications]="facade.pendingApplications()"
    [acceptedApplications]="facade.acceptedApplications()"
    [recentApplications]="facade.recentApplications()"
  />

  <app-quick-actions
    class="block w-full min-w-0 max-w-full"
    [actions]="quickActions"
  />

  <app-activity-feed
    class="block w-full min-w-0 max-w-full"
    [activities]="facade.activityFeed()"
  />

</section>

  <nav
    aria-label="Dashboard quick actions"
    class="fixed bottom-0 right-0 z-70
          border-t border-slate-200
          bg-white/95 px-2 pt-2
          pb-[calc(0.5rem+env(safe-area-inset-bottom))]
          shadow-[0_-8px_24px_rgba(15,23,42,0.14)]
          backdrop-blur
          transition-[left] duration-300
          xl:hidden"
    [ngClass]="{
      'left-0': isMobileView(),
      'left-72': !isMobileView() && isSidebarOpen(),
      'left-20': !isMobileView() && !isSidebarOpen()
    }"
  >
    <div class="mx-auto grid max-w-xl grid-cols-4 gap-1">
      @for (action of quickActions; track action.route) {
        <a
          [routerLink]="action.route"
          routerLinkActive="bg-[#F4B400]/15 text-[#000035]"
          [routerLinkActiveOptions]="{ exact: false }"
          [attr.aria-label]="action.label"
          [title]="action.label"
          class="group inline-flex min-h-14 min-w-0
                items-center justify-center rounded-xl
                text-slate-500 transition-colors
                hover:bg-slate-100 hover:text-[#000035]
                focus-visible:outline-none
                focus-visible:ring-2
                focus-visible:ring-inset
                focus-visible:ring-[#F4B400]"
        >
        <span
          aria-hidden="true"
          class="flex h-10 w-10 items-center justify-center
                rounded-xl transition-colors
                group-hover:bg-[#F4B400]/10"
        >
          @switch (action.icon) {
            @case ('square-pen') {
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z" />
              </svg>
            }

            @case ('file-up') {
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
                <path d="M14 2v4a2 2 0 0 0 2 2h4" />
                <path d="M12 12v6" />
                <path d="m15 15-3-3-3 3" />
              </svg>
            }

            @case ('clipboard-check') {
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect width="8" height="4" x="8" y="2" rx="1" />
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                <path d="m9 14 2 2 4-4" />
              </svg>
            }

            @case ('images') {
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 22H4a2 2 0 0 1-2-2V6" />
                <path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18" />
                <circle cx="12" cy="8" r="2" />
                <rect width="16" height="16" x="6" y="2" rx="2" />
              </svg>
            }
          }
        </span>
        </a>
      }
    </div>
  </nav>
