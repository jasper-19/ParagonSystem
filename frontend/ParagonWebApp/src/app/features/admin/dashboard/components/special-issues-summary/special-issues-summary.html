<section
    aria-labelledby="special-issues-overview-title"
    class="dashboard-section summary-section"
  >
  <div class="section-heading">
    <h2
      id="special-issues-overview-title"
      class="text-lg font-bold tracking-tight text-[#000035]
             sm:text-xl"
    >
      Special Issues Overview
    </h2>

    <p class="text-sm text-slate-600">
      Publication issue statistics
    </p>
  </div>

  <div
    class="summary-grid"
  >

    <app-dashboard-card
      title="Total Issues"
      [value]="totalIssues"
      variant="default"
    />

    <app-dashboard-card
      title="Published"
      [value]="publishedIssues"
      variant="success"
    />

    <app-dashboard-card
      title="Drafts"
      [value]="draftIssues"
      variant="info"
    />

    <app-dashboard-card
      title="Archived"
      [value]="archivedIssues"
      variant="neutral"
    />

  </div>

</section>
