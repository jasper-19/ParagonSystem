<section aria-labelledby="quick-actions-title" class="dashboard-section quick-actions-section">
  <div class="section-heading"><h2 id="quick-actions-title">Quick Actions</h2><p>Frequently used administrative tasks</p></div>
  <div class="quick-actions-grid">
    @for (action of actions(); track action.route) {
      <a [routerLink]="action.route" class="quick-action">
        <svg class="quick-action-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          @switch (action.icon) {
            @case ('square-pen') { <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M16 3l5 5M9 15l1-5L18 2l4 4-8 8z"/> }
            @case ('file-up') { <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8L14 2v6h6M12 18v-7m-3 3 3-3 3 3"/> }
            @case ('clipboard-check') { <rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8 4H5v18h14V4h-3M8 14l3 3 5-6"/> }
            @case ('images') { <rect x="6" y="2" width="16" height="16" rx="2"/><path d="M18 22H2V6m4 9 5-5 4 4 3-3 4 4"/><circle cx="16" cy="7" r="1"/> }
          }
        </svg>
        <div><h3>{{ action.label }}</h3>@if (action.description) { <p>{{ action.description }}</p> }</div>
        <svg class="quick-action-arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
      </a>
    }
  </div>
</section>
