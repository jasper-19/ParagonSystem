<section
  aria-labelledby="articles-overview-title"
  class="dashboard-section summary-section"
>
  <div class="section-heading">
    <h2
      id="articles-overview-title"
      class="text-lg font-bold tracking-tight text-[#000035]
             sm:text-xl"
    >
      Articles Overview
    </h2>

    <p class="text-sm text-slate-600">
      Summary of all article statuses
    </p>
  </div>

  <div
    class="summary-grid"
  >

    <app-dashboard-card
      title="Total Articles"
      [value]="totalArticles"
      variant="default"
    />

    <app-dashboard-card
      title="Published"
      [value]="publishedArticles"
      variant="success"
    />

    <app-dashboard-card
      title="Drafts"
      [value]="draftArticles"
      variant="info"
    />

    <app-dashboard-card
      title="Archived"
      [value]="archivedArticles"
      variant="neutral"
    />

  </div>

</section>
