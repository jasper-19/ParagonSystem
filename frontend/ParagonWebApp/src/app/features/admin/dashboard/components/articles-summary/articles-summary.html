<section
  aria-labelledby="articles-overview-title"
  class="min-w-0 space-y-4 rounded-2xl border border-slate-200
         bg-white p-4 shadow-sm
         sm:space-y-5 sm:p-5
         lg:p-6"
>
  <div class="space-y-1">
    <h2
      id="articles-overview-title"
      class="text-lg font-bold tracking-tight text-[#000035]
             sm:text-xl"
    >
      Articles Overview
    </h2>

    <p class="text-sm text-slate-600">
      Summary of all article statuses
    </p>
  </div>

  <div
    class="grid min-w-0 grid-cols-1 gap-3
           min-[480px]:grid-cols-2
           sm:gap-4"
  >

    <app-dashboard-card
      title="Total Articles"
      [value]="totalArticles"
      variant="default"
    />

    <app-dashboard-card
      title="Published"
      [value]="publishedArticles"
      variant="success"
    />

    <app-dashboard-card
      title="Drafts"
      [value]="draftArticles"
      variant="info"
    />

    <app-dashboard-card
      title="Archived"
      [value]="archivedArticles"
      variant="neutral"
    />

  </div>

</section>
