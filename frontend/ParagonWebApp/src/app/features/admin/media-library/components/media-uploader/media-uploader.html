<div
  class="relative"
>

  <!-- Upload Button -->
  <label
    class="group inline-flex min-h-11 cursor-pointer
          select-none items-center justify-center gap-2
          whitespace-nowrap rounded-xl
          border border-[#F4B400]/35
          bg-[#000035] px-4 py-2.5
          text-sm font-semibold text-[#F4B400]
          transition-colors duration-150
          hover:border-[#F4B400]
          hover:bg-[#F4B400]
          hover:text-[#000035]
          focus-within:outline-none
          focus-within:ring-2
          focus-within:ring-[#F4B400]
          focus-within:ring-offset-2"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
      <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
    </svg>
    Upload media
    <input
      type="file"
      accept="image/*"
      multiple
      class="sr-only"
      (change)="onFileInputChange($event)"
    />
  </label>

  <!-- Drag Overlay -->
  <div
    *ngIf="isDragging()"
    class="pointer-events-none fixed inset-0 z-70
          flex items-center justify-center
          bg-[#000035]/60 px-4
          backdrop-blur-sm"
    role="status"
    aria-live="polite"
  >
    <div
      class="flex w-full max-w-md flex-col
            items-center gap-4 rounded-2xl
            border-2 border-dashed border-[#F4B400]
            bg-white px-6 py-10 text-center
            shadow-2xl sm:px-10 sm:py-12"
    >

      <!-- Icon -->
      <div
        class="w-14 h-14 rounded-full flex items-center justify-center"
        style="background: rgba(244,180,0,0.1); border: 0.5px solid rgba(244,180,0,0.35);">
        <svg
          class="h-6 w-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
          <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
        </svg>
      </div>

      <!-- Text -->
        <div class="text-center">
          <p class="text-base font-semibold text-[#000035]">
            Drop images to upload
          </p>

          <p class="mt-1 text-sm text-slate-600">
            Release to add them to your media library
          </p>
        </div>

      <!-- Supported formats pill -->
        <div
          class="inline-flex items-center gap-1.5
                rounded-full border border-[#F4B400]/25
                bg-[#F4B400]/10 px-3.5 py-1.5"
        >
          <svg
            aria-hidden="true"
            class="h-3 w-3 text-[#F4B400]"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="20 6 9 17 4 12" />
          </svg>

          <span class="text-xs font-medium tracking-wide text-[#000035]">
            Images supported
          </span>
        </div>

    </div>
  </div>

</div>
