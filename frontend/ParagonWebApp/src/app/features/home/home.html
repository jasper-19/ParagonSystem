<main id="main-content" class="publication-home">
  <app-welcome-banner />
  <ng-container *ngIf="homepageFeed() as feed; else homepageEmpty">
    <app-featured-section [articles]="feed.featured" />
    <app-most-viewed-section [articles]="feed.mostViewed" />
    <app-category-section [sections]="feed.categories" />
    <app-more-stories-section [articles]="feed.moreStories" />
  </ng-container>
</main>

<ng-template #homepageEmpty>
  <div class="pub-empty pub-empty--page">
    <div class="mx-auto max-w-lg text-center">
      <h2 class="text-balance text-3xl font-black leading-tight text-[#000035] sm:text-4xl">
        The publication is preparing its next articles.
      </h2>
      <p class="mx-auto mt-4 max-w-md text-pretty text-base leading-7 text-[#000035]/65">
        Published articles will appear here as soon as they are ready.
      </p>
      <a
        routerLink="/top-stories"
        class="mt-8 inline-flex min-h-11 items-center justify-center bg-[#000035] px-6 py-3 text-sm font-bold text-white transition-colors hover:bg-[#10105a] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#F4B400]"
      >
        Browse all articles
      </a>
    </div>
  </div>
</ng-template>
