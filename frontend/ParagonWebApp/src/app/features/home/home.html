<ng-container *ngIf="homepageFeed() as feed; else homepageEmpty">

  <app-welcome-banner />

  <app-featured-section
    [articles]="feed.featured">
  </app-featured-section>

  <app-most-viewed-section
    [articles]="feed.mostViewed">
  </app-most-viewed-section>

  <app-category-section
    [sections]="feed.categories">
  </app-category-section>

  <app-more-stories-section
    [articles]="feed.moreStories">
  </app-more-stories-section>

</ng-container>

<ng-template #homepageEmpty>
  <section class="min-h-[60vh] flex items-center justify-center bg-white px-6">
    <div class="max-w-md text-center">
      <p class="text-xs font-black uppercase tracking-[0.3em] text-[#F4B400] mb-3">
        No Content Yet
      </p>

      <h1 class="text-3xl sm:text-4xl font-black text-[#000035] mb-4">
        No published stories available.
      </h1>

      <p class="text-sm text-[#000035]/60 leading-relaxed">
        Once articles are published, they will automatically appear here.
      </p>
    </div>
  </section>
</ng-template>
