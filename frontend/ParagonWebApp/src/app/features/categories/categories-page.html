<div class="top-stories-page">
  <app-categories-hero [title]="selectedCategory() ?? 'Top Articles'" subtitle="Explore timely reporting, thoughtful perspectives, and articles from across the community." />
  <main id="main-content">
    <section class="filters-shell" aria-labelledby="story-filters-title">
      <div class="filter-panel">
        <header class="filter-panel__header">
          <h2 id="story-filters-title">Find the articles that matter to you</h2>
          <button type="button" class="clear-button" [disabled]="!hasActiveFilters() && !searchQuery().trim()" (click)="clearFilters()">Clear filters <span *ngIf="activeFilterCount() > 0">({{ activeFilterCount() }})</span></button>
        </header>
        <div class="filter-panel__body">
          <div class="primary-controls">
            <label class="control"><span>Search articles</span><span class="control__field">
              <svg class="control__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
              <input #searchInput type="search" inputmode="search" autocomplete="off" placeholder="Search by title, topic, or author" [value]="searchQuery()" (input)="onSearchInput(searchInput.value)" />
            </span></label>
            <label class="control"><span>Sort by</span><span class="control__field">
              <select #sortSelect [value]="sort()" (change)="setSort(sortSelect.value)"><option value="latest">Newest first</option><option value="oldest">Oldest first</option><option value="mostViewed">Most viewed</option></select>
              <svg class="control__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </span></label>
          </div>
          <fieldset class="filter-group"><legend>Browse by category</legend>
            <div class="filter-options filter-options--categories">
              <button type="button" class="filter-chip filter-chip--category" [attr.aria-pressed]="!selectedCategory()" (click)="setCategory(undefined)">All articles</button>
              <button *ngFor="let category of categories()" type="button" class="filter-chip filter-chip--category" [attr.aria-pressed]="selectedCategory() === category" (click)="setCategory(category)">{{ category }}</button>
            </div>
          </fieldset>
          <fieldset *ngIf="tags().length > 0" class="filter-group"><legend>Refine by topic</legend>
            <div class="filter-options">
              <button *ngFor="let tag of visibleTags()" type="button" class="filter-chip filter-chip--tag" [attr.aria-pressed]="selectedTags().includes(tag)" (click)="toggleTag(tag)">{{ formatTag(tag) }}</button>
              <button *ngIf="hiddenTagCount() > 0" type="button" class="tags-toggle" [attr.aria-expanded]="showAllTags()" (click)="toggleTagVisibility()">{{ showAllTags() ? 'Show fewer' : 'Show ' + hiddenTagCount() + ' more' }}</button>
            </div>
          </fieldset>
        </div>
      </div>
    </section>
    <section class="stories-shell" aria-labelledby="stories-heading">
      <header class="stories-heading"><h2 id="stories-heading">{{ selectedCategory() ? selectedCategory() + ' articles' : 'Top articles' }}</h2><p role="status">{{ total() }} {{ total() === 1 ? 'article' : 'articles' }} loaded</p></header>
      <app-categories-articles [articles]="articles()" [loading]="loading()" [initialLoading]="initialLoading()" [hasMore]="hasMore()" [errorMessage]="loadError()" (retry)="retryLoad()" (loadMore)="onLoadMore()" />
    </section>
  </main>
</div>
