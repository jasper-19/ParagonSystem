<section class="bg-white px-4 py-16 sm:px-6 sm:py-20 lg:py-24" aria-labelledby="join-faq-heading">
  <div class="mx-auto grid max-w-7xl gap-10 lg:grid-cols-[minmax(16rem,0.65fr)_minmax(0,1.35fr)] lg:gap-16">
    <div>
      <p class="text-[0.6875rem] font-black uppercase tracking-[0.2em] text-[#F4B400]">Before you apply</p>
      <h2 id="join-faq-heading" class="mt-2 text-balance text-3xl font-black tracking-tight text-[#000035] sm:text-4xl">
        {{ sectionTitle() }}
      </h2>
      <p class="mt-4 max-w-md text-base leading-7 text-slate-600">
        Get quick answers about eligibility, experience, commitment, and the review process.
      </p>
    </div>

    <div class="space-y-3">
      <article
        *ngFor="let faq of faqs(); let i = index"
        class="overflow-hidden rounded-2xl border bg-white transition"
        [ngClass]="activeIndex() === i ? 'border-[#F4B400] shadow-md' : 'border-slate-200 shadow-sm'"
      >
        <h3>
          <button
            type="button"
            (click)="toggle(i)"
            class="flex min-h-16 w-full items-center justify-between gap-4 px-4 py-4 text-left focus-visible:outline-3 focus-visible:-outline-offset-3 focus-visible:outline-[#F4B400] sm:px-6"
            [attr.aria-expanded]="activeIndex() === i"
            [attr.aria-controls]="'join-faq-answer-' + i"
            [id]="'join-faq-question-' + i"
          >
            <span class="flex min-w-0 items-center gap-3 sm:gap-4">
              <span
                class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl text-xs font-black tabular-nums transition"
                [ngClass]="activeIndex() === i ? 'bg-[#F4B400] text-[#000035]' : 'bg-slate-100 text-slate-500'"
                aria-hidden="true"
              >
                0{{ i + 1 }}
              </span>
              <span class="text-base font-black text-[#000035] sm:text-lg">{{ faq.question }}</span>
            </span>

            <span
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl transition"
              [ngClass]="activeIndex() === i ? 'bg-[#000035] text-white' : 'bg-slate-100 text-slate-500'"
              aria-hidden="true"
            >
              <svg class="h-5 w-5 transition-transform duration-200 motion-reduce:transition-none" [class.rotate-180]="activeIndex() === i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="m6 9 6 6 6-6" />
              </svg>
            </span>
          </button>
        </h3>

        <div
          *ngIf="activeIndex() === i"
          [id]="'join-faq-answer-' + i"
          role="region"
          [attr.aria-labelledby]="'join-faq-question-' + i"
          class="px-4 pb-5 sm:px-6 sm:pb-6"
        >
          <p class="border-l-2 border-[#F4B400] pl-4 text-sm leading-7 text-slate-600 sm:ml-13 sm:text-base">
            {{ faq.answer }}
          </p>
        </div>
      </article>
    </div>
  </div>
</section>
