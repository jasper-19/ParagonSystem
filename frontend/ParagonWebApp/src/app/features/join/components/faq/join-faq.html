<section class="join-section" aria-labelledby="join-faq-heading">
  <div class="join-shell join-faq-layout">
    <div class="join-section-intro"><h2 id="join-faq-heading">{{ sectionTitle() }}</h2><p>Get quick answers about eligibility, experience, commitment, and the review process.</p></div>
    <div class="join-faq-list"><article *ngFor="let faq of faqs(); let i = index" [class.is-expanded]="activeIndex() === i"><h3><button type="button" (click)="toggle(i)" [attr.aria-expanded]="activeIndex() === i" [attr.aria-controls]="'join-faq-answer-' + i" [id]="'join-faq-question-' + i"><span>{{ faq.question }}</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14"/><path *ngIf="activeIndex() !== i" d="M12 5v14"/></svg></button></h3><div *ngIf="activeIndex() === i" [id]="'join-faq-answer-' + i" role="region" [attr.aria-labelledby]="'join-faq-question-' + i"><p>{{ faq.answer }}</p></div></article></div>
  </div>
</section>
