<section id="why-join" class="join-section" aria-labelledby="why-join-heading">
  <div class="join-shell">
    <div class="join-section-intro"><h2 id="why-join-heading">{{ sectionTitle() }}</h2><p>Develop your craft, serve the student community, and create work that makes a lasting contribution.</p></div>
    <div class="join-benefits"><article *ngFor="let benefit of benefits()"><h3>{{ benefit.title }}</h3><p>{{ benefit.description }}</p></article></div>
  </div>
</section>
