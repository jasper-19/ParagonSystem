<section id="why-join" class="scroll-mt-20 bg-white px-4 py-16 sm:px-6 sm:py-20 lg:py-24" aria-labelledby="why-join-heading">
  <div class="mx-auto max-w-7xl">
    <div class="max-w-2xl">
      <p class="text-[0.6875rem] font-black uppercase tracking-[0.2em] text-[#F4B400]">Your opportunity</p>
      <h2 id="why-join-heading" class="mt-2 text-balance text-3xl font-black tracking-tight text-[#000035] sm:text-4xl">
        {{ sectionTitle() }}
      </h2>
      <p class="mt-4 text-base leading-7 text-slate-600 sm:text-lg">
        Develop your craft, serve the student community, and create work that makes a lasting contribution.
      </p>
    </div>

    <div class="mt-10 grid gap-5 md:grid-cols-3 lg:gap-6">
      <article
        *ngFor="let benefit of benefits(); let i = index"
        class="group relative overflow-hidden rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-1 hover:border-[#F4B400] hover:shadow-xl motion-reduce:transform-none motion-reduce:transition-none sm:p-7"
      >
        <div class="flex items-start justify-between gap-4">
          <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-[#000035] text-sm font-black tabular-nums text-white">
            0{{ i + 1 }}
          </span>
          <span class="h-16 w-16 rounded-full bg-[#F4B400]/10 blur-xl transition group-hover:bg-[#F4B400]/20" aria-hidden="true"></span>
        </div>
        <h3 class="mt-6 text-xl font-black tracking-tight text-[#000035]">
          {{ benefit.title }}
        </h3>
        <p class="mt-3 text-sm leading-7 text-slate-600 sm:text-[0.9375rem]">
          {{ benefit.description }}
        </p>
      </article>
    </div>
  </div>
</section>
