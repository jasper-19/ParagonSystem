@if (isOpen()) {
<div class="action-dialog-overlay" (click)="close()">
  <section appActionDialog (dialogDismissed)="close()" class="action-dialog is-success" role="dialog" aria-modal="true" [attr.aria-labelledby]="dialogId + '-title'" [attr.aria-describedby]="dialogId + '-message'" tabindex="-1" (click)="$event.stopPropagation()">
    <button type="button" class="action-dialog-close" aria-label="Close dialog" (click)="close()"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" d="m6 6 12 12M18 6 6 18"/></svg></button>
    <div class="action-dialog-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" stroke-linejoin="round" d="m8 12 3 3 5-6"/></svg></div>
    <h3 class="action-dialog-title" [id]="dialogId + '-title'">{{ title() }}</h3>
    <p class="action-dialog-message" [id]="dialogId + '-message'">{{ message() }}</p>

    <div class="action-dialog-actions"><button type="button" class="action-dialog-button" data-dialog-initial (click)="close()">{{ buttonText() }}</button></div>
  </section>
</div>
}
