@if (breadcrumbs().length > 0) {
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <ol class="breadcrumb__trail" role="list">
      @for (crumb of breadcrumbs(); track trackBreadcrumb($index, crumb); let first = $first; let last = $last) {
        <li class="breadcrumb__item">
          @if (!first) {
            <svg class="breadcrumb__separator" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          }
          @if (!last) {
            <a class="breadcrumb__link" [routerLink]="crumb.url">{{ crumb.label }}</a>
          } @else {
            <span class="breadcrumb__current" aria-current="page">{{ crumb.label }}</span>
          }
        </li>
      }
    </ol>
  </nav>
}
