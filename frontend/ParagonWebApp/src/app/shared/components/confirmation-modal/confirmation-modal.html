@if (isOpen()) {
<div class="action-dialog-overlay">
  <section appActionDialog (dialogDismissed)="close()" class="action-dialog" [class.is-danger]="variant() === 'danger'" role="alertdialog" aria-modal="true" [attr.aria-labelledby]="dialogId + '-title'" [attr.aria-describedby]="dialogId + '-message'" tabindex="-1">
    <button type="button" class="action-dialog-close" aria-label="Close dialog" (click)="close()"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" d="m6 6 12 12M18 6 6 18"/></svg></button>
    <div class="action-dialog-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="m12 3 10 18H2L12 3Z"/><path stroke-linecap="round" d="M12 9v5m0 3h.01"/></svg></div>
    <h3 class="action-dialog-title" [id]="dialogId + '-title'">{{ title() }}</h3>
    <p class="action-dialog-message" [id]="dialogId + '-message'">{{ message() }}</p>
    <div class="action-dialog-actions">
      <button type="button" class="action-dialog-button action-dialog-primary" (click)="confirm()">{{ confirmText() }}</button>
      <button type="button" class="action-dialog-button" data-dialog-initial (click)="close()">{{ cancelText() }}</button>
    </div>
  </section>
</div>
}
