<ng-container *ngIf="isOpen() && member()">

  <div
    class="fixed inset-0 z-9999
          flex items-end justify-center
          bg-slate-950/70
          backdrop-blur-sm
          sm:items-center sm:p-4"
    (click)="close()"
  >
    <section
      #dialogContainer
      tabindex="-1"
      role="dialog"
      aria-modal="true"
      aria-labelledby="view-member-title"
      class="relative flex max-h-[94dvh]
            w-full max-w-md flex-col
            overflow-hidden bg-white
            shadow-2xl
            rounded-t-3xl
            sm:max-h-[calc(100dvh-2rem)]
            sm:rounded-3xl"
      (click)="$event.stopPropagation()"
      (keydown)="onDialogKeydown($event)"
    >

      <!-- ==================== -->
      <!-- Header               -->
      <!-- ==================== -->

        <header
          class="relative z-10 shrink-0
                bg-linear-to-br
                from-[#000035]
                via-[#001f5c]
                to-[#000035]
                px-4 pb-5 pt-6
                sm:px-6 sm:pb-6 sm:pt-7"
        >
          <!-- Close button -->
          <button
            #closeButton
            type="button"
            (click)="close()"
            class="absolute right-3 top-3
                  inline-flex h-11 w-11
                  items-center justify-center
                  rounded-xl border border-white/10
                  bg-white/10 text-white
                  transition-colors
                  hover:bg-white/20
                  focus-visible:outline-none
                  focus-visible:ring-2
                  focus-visible:ring-[#F4B400]
                  sm:right-4 sm:top-4"
            aria-label="Close member information dialog"
          >
            <!-- close icon -->
          </button>

          <!-- Centered identity -->
          <div
            class="mx-auto flex max-w-xs
                  flex-col items-center
                  text-center"
          >
            <div
              class="flex h-20 w-20 shrink-0
                    items-center justify-center
                    overflow-hidden rounded-full
                    border-[3px] border-white/30
                    shadow-lg"
              [ngClass]="{
                'bg-white/15 text-3xl font-extrabold text-white':
                  !member()!.image
              }"
            >
              <ng-container *ngIf="member()!.image; else initialsAvatar">
                <img
                  [src]="member()!.image"
                  [alt]="member()!.name + ' profile photo'"
                  class="h-full w-full object-cover"
                />
              </ng-container>

              <ng-template #initialsAvatar>
                {{ member()!.initials || member()!.name.charAt(0) }}
              </ng-template>
            </div>

            <div class="mt-4 min-w-0">
              <h3
                id="view-member-title"
                class="break-words text-xl
                      font-bold leading-tight
                      text-white sm:text-2xl"
              >
                {{ member()!.name }}
              </h3>

              <p class="mt-1 text-sm font-medium text-white/65">
                {{ member()!.position }}
              </p>
            </div>
          </div>
        </header>


      <!-- ==================== -->
      <!-- Body                 -->
      <!-- ==================== -->

      <div
        class="min-h-0 flex-1 space-y-5
              overflow-y-auto
              overscroll-contain
              px-4 py-5
              sm:px-6 sm:py-6"
      >

        <!-- Info Rows -->
        <dl class="space-y-3">

          <!-- Section -->
          <div
            class="flex items-start gap-3
                  rounded-xl border border-slate-200
                  bg-slate-50 px-4 py-3"
          >
            <div
              aria-hidden="true"
              class="flex h-9 w-9 shrink-0
                    items-center justify-center
                    rounded-lg bg-[#000035]/10"
            >
              <svg
                class="h-4 w-4 text-[#000035]"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M17 20h5v-2a3 3 0 0 0-5.356-1.857
                    M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857
                    M7 20H2v-2a3 3 0 0 1 5.356-1.857
                    M7 20v-2c0-.656.126-1.283.356-1.857
                    m0 0a5.002 5.002 0 0 1 9.288 0
                    M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"
                />
              </svg>
            </div>

            <div class="min-w-0 flex-1">
              <dt
                class="text-[11px] font-semibold
                      uppercase tracking-wide
                      text-slate-400"
              >
                Section
              </dt>

              <dd
                class="mt-1 break-words
                      text-sm font-semibold
                      text-slate-800"
              >
                {{ sectionTitle() || '—' }}
              </dd>
            </div>
          </div>

          <!-- Role -->
          <div
            class="flex items-start gap-3
                  rounded-xl border border-[#F4B400]/25
                  bg-[#F4B400]/8 px-4 py-3"
          >
            <div
              aria-hidden="true"
              class="flex h-9 w-9 shrink-0
                    items-center justify-center
                    rounded-lg bg-[#F4B400]/20"
            >
              <svg
                class="h-4 w-4 text-[#000035]"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 12l2 2 4-4
                    M7.835 4.697a3.42 3.42 0 0 0 1.946-.806
                    3.42 3.42 0 0 1 4.438 0
                    3.42 3.42 0 0 0 1.946.806
                    3.42 3.42 0 0 1 3.138 3.138
                    3.42 3.42 0 0 0 .806 1.946
                    3.42 3.42 0 0 1 0 4.438
                    3.42 3.42 0 0 0-.806 1.946
                    3.42 3.42 0 0 1-3.138 3.138
                    3.42 3.42 0 0 0-1.946.806
                    3.42 3.42 0 0 1-4.438 0
                    3.42 3.42 0 0 0-1.946-.806
                    3.42 3.42 0 0 1-3.138-3.138
                    3.42 3.42 0 0 0-.806-1.946
                    3.42 3.42 0 0 1 0-4.438
                    3.42 3.42 0 0 0 .806-1.946
                    3.42 3.42 0 0 1 3.138-3.138z"
                />
              </svg>
            </div>

            <div class="min-w-0 flex-1">
              <dt
                class="text-[11px] font-semibold
                      uppercase tracking-wide
                      text-slate-400"
              >
                Role
              </dt>

              <dd
                class="mt-1 break-words
                      text-sm font-bold
                      text-[#000035]"
              >
                {{ member()!.position || '—' }}
              </dd>
            </div>
          </div>

          <!-- Year Level -->
          <div
            class="flex items-start gap-3
                  rounded-xl border border-slate-200
                  bg-slate-50 px-4 py-3"
          >
            <div
              aria-hidden="true"
              class="flex h-9 w-9 shrink-0
                    items-center justify-center
                    rounded-lg bg-indigo-100"
            >
              <svg
                class="h-4 w-4 text-indigo-600"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 14l9-5-9-5-9 5 9 5z"
                />

                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 14l6.16-3.422A12.083 12.083 0 0 1 21 17
                    c0 2.5-1.5 4-9 4s-9-1.5-9-4
                    a12.083 12.083 0 0 1 2.84-6.422L12 14z"
                />
              </svg>
            </div>

            <div class="min-w-0 flex-1">
              <dt
                class="text-[11px] font-semibold
                      uppercase tracking-wide
                      text-slate-400"
              >
                Year Level
              </dt>

              <dd
                class="mt-1 text-sm font-semibold
                      text-slate-800"
              >
                {{ getYearLevelLabel(member()!.yearLevel) }}
              </dd>
            </div>
          </div>

        </dl>

        <!-- Actions -->
        <footer
          class="shrink-0 border-t border-slate-200
                bg-white/95 px-4 pt-3
                pb-[calc(0.75rem+env(safe-area-inset-bottom))]
                backdrop-blur
                sm:px-6 sm:pb-3"
        >
          <div
            class="grid grid-cols-1 gap-3
                  min-[420px]:grid-cols-2"
          >
            <button
              type="button"
              (click)="close()"
              class="inline-flex min-h-11
                    items-center justify-center
                    rounded-xl border border-slate-300
                    bg-white px-4 py-2.5
                    text-sm font-semibold text-slate-700
                    transition hover:bg-slate-50
                    focus-visible:outline-none
                    focus-visible:ring-2
                    focus-visible:ring-[#F4B400]"
            >
              Close
            </button>

            <button
              type="button"
              (click)="requestEdit()"
              class="inline-flex min-h-11
                    items-center justify-center
                    rounded-xl bg-[#000035]
                    px-4 py-2.5
                    text-sm font-semibold
                    text-[#F4B400]
                    transition hover:bg-[#0a1a2e]
                    focus-visible:outline-none
                    focus-visible:ring-2
                    focus-visible:ring-[#F4B400]"
            >
              Edit Assignment
            </button>
          </div>
        </footer>

      </div>

    </section>

  </div>

</ng-container>
