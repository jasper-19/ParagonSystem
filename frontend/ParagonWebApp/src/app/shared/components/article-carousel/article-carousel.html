<section
  *ngIf="articlesList().length"
  [class]="sectionClass"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="flex items-end justify-between gap-6 mb-8 sm:mb-12">
      <div>
        <p
          *ngIf="eyebrow"
          class="text-xs font-black uppercase tracking-[0.3em] text-[#F4B400] mb-2"
        >
          {{ eyebrow }}
        </p>

        <h3 class="text-2xl sm:text-3xl font-black text-[#000035]">
          {{ title }}
        </h3>
      </div>
    </div>

    <div class="flex items-center gap-6 lg:gap-8"
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)"
    >
    <div class="hidden md:flex w-14 lg:w-16 justify-center shrink-0">
      <button
        *ngIf="showArrows()"
        type="button"
        (click)="prev()"
        aria-label="Previous stories"
        class="w-12 h-12 rounded-full flex items-center justify-center bg-white border border-[#000035]/10  text-[#000035] shadow-md
             hover:bg-[#000035] hover:text-white hover:scale-110 hover:shadow-xl transition-all duration-300">
        <svg
          class="w-5 h-5 shrink-0"
          xmlns="http://www.w3.org/2000/svg"
          fill="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill-rule="evenodd"
            d="M13.729 5.575c1.304-1.074 3.27-.146 3.27 1.544v9.762c0 1.69-1.966 2.618-3.27 1.544l-5.927-4.881a2 2 0 0 1 0-3.088l5.927-4.88Z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>

    <div class="overflow-hidden flex-1">
      <div
        class="flex transition-transform duration-500 ease-out"
        [ngStyle]="trackStyle()"
        (transitionend)="onTransitionEnd()"
      >
      <div
          *ngFor="let page of renderedPages()"
          class="shrink-0 w-full grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 lg:gap-10"
      >
           <a
            *ngFor="let article of page; trackBy: trackByArticle"
            [routerLink]="['/article', article.slug]"
            class="group bg-white rounded-2xl overflow-hidden transition-all duration-300 hover:-translate-y-1 flex flex-col h-full"
          >
            <div class="aspect-16/10 overflow-hidden">
              <ng-container *ngIf="article.image; else ImagePlaceholder">
                <img
                  [src]="imageVariant(article.image, 'medium')"
                  [alt]="article.title"
                  loading="lazy"
                  decoding="async"
                  class="w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-105"
                />
              </ng-container>

                <ng-template #ImagePlaceholder>
                  <app-image-placeholder
                    size="medium"
                  ></app-image-placeholder>
                </ng-template>

            </div>

            <div class="p-5 sm:p-6 flex flex-col flex-1">
              <span class="self-start inline-block text-xs font-semibold px-3 py-1 rounded-full bg-[#000035] text-[#f4b400] uppercase tracking-wide mb-4">
                {{ article.category }}
              </span>

              <h4 class="text-lg sm:text-xl font-bold leading-snug line-clamp-2 mb-3 group-hover:text-[#F4B400] transition-colors duration-300">
                {{ article.title }}
              </h4>

              <p
                *ngIf="article.excerpt"
                class="text-gray-600 text-sm leading-relaxed line-clamp-3 mb-6"
              >
                {{ article.excerpt }}
              </p>

              <div class="mt-auto pt-4 border-t border-gray-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-xs text-gray-500">
                <span>{{ article.author || 'Paragon' }}</span>
                <span>{{ article.publishedAt | date:'MMM d, yyyy' }}</span>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <div class="hidden md:flex w-14 lg:w-16 justify-center shrink-0">
      <button
        *ngIf="showArrows()"
        type="button"
        (click)="next()"
        aria-label="Next stories"
        class="w-12 h-12 rounded-full flex items-center justify-center bg-white border border-[#000035]/10  text-[#000035] shadow-md
             hover:bg-[#000035] hover:text-white hover:scale-110 hover:shadow-xl transition-all duration-300">
        <svg
          class="w-5 h-5 shrink-0"
          xmlns="http://www.w3.org/2000/svg"
          fill="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill-rule="evenodd"
            d="M10.271 5.575C8.967 4.501 7 5.43 7 7.12v9.762c0 1.69 1.967 2.618 3.271 1.544l5.927-4.881a2 2 0 0 0 0-3.088l-5.927-4.88Z"
            clip-rule="evenodd"
          />
        </svg>
      </button>
    </div>

    </div>

        <div
          *ngIf="showDots()"
          class="flex items-center justify-center gap-2 mt-8"
        >
          <button
            *ngFor="let dot of dots(); let i = index"
            type="button"
            (click)="goTo(i)"
            class="h-2 rounded-full transition-all duration-300"
            [ngClass]="
              i === currentPage()
                ? 'w-6 bg-[#000035]'
                : 'w-2 bg-[#000035]/20 hover:bg-[#000035]/40'
            "
            [attr.aria-label]="'Go to story ' + (i + 1)"
          ></button>
        </div>

    </div>

</section>
