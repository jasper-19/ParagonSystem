<ng-container *ngIf="isOpen() && position() as pos">
  <div class="role-backdrop" (click)="close()">
    <section #dialogPanel class="role-dialog" role="dialog" aria-modal="true" [attr.aria-labelledby]="'position-modal-title-' + pos.id" tabindex="-1" (click)="$event.stopPropagation()">
      <header><div><h3 [id]="'position-modal-title-' + pos.id">{{ pos.title }}</h3><p>{{ pos.department }}</p></div><button type="button" (click)="close()" aria-label="Close role details"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <div class="role-content"><p>{{ pos.description }}</p><section *ngIf="pos.subRoles?.length" aria-label="Specializations"><h4>Specializations</h4><dl><div *ngFor="let sub of pos.subRoles"><dt>{{ sub.name }}</dt><dd>{{ sub.description }}</dd></div></dl></section></div>
    </section>
  </div>
</ng-container>
