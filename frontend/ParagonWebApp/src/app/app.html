@if (publicSettings()?.maintenance?.enabled && !isAdminRoute()) {
  <main class="flex min-h-screen items-center justify-center bg-[#000035] px-5 py-12 text-white">
    <section class="w-full max-w-xl text-center" aria-labelledby="maintenance-title">
      <img
        [src]="publicSettings()?.general?.logoUrl || 'assets/PRG_Logo.png'"
        [alt]="(publicSettings()?.general?.siteName || 'Paragon') + ' logo'"
        class="mx-auto h-16 w-auto object-contain"
      />
      <p class="mt-8 text-xs font-black uppercase tracking-[0.2em] text-[#F4B400]">
        Scheduled maintenance
      </p>
      <h1 id="maintenance-title" class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl">
        We’ll be back shortly
      </h1>
      <p class="mx-auto mt-4 max-w-lg text-sm leading-7 text-white/70 sm:text-base">
        {{ publicSettings()?.maintenance?.message }}
      </p>
      <div class="mx-auto mt-8 h-1 w-20 rounded-full bg-[#F4B400]" aria-hidden="true"></div>
      <p class="mt-8 text-xs text-white/45">
        {{ publicSettings()?.general?.siteName || 'The Paragon' }}
        · {{ publicSettings()?.general?.organizationName }}
      </p>
    </section>
  </main>
} @else {
  <router-outlet />
}
