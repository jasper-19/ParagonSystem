version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-security-updates:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend/ParagonWebApp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-security-updates:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
